[workspace]
members = [
  "crates/matchbox-engine",
  "crates/matchbox-node",
  "crates/matchbox-wasm",
  "crates/matchbox-webgpu",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "flex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matchbox-engine = { path = "crates/matchbox-engine" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
strip = true
